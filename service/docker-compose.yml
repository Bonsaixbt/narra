services:
  narra:
    build: { context: .., dockerfile: service/Dockerfile }
    env_file: .env
    ports: ["127.0.0.1:4663:4663"]     # put a reverse proxy with TLS in front
    volumes: ["./data:/data"]
    restart: unless-stopped
  backup:
    image: alpine:3.20
    volumes: ["./data:/data", "./backups:/backups"]
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache sqlite >/dev/null && while true; do sqlite3 /data/narra.db \".backup /backups/narra-$(date +%Y%m%d%H).db\"; find /backups -name 'narra-*.db' -mtime +7 -delete; sleep 3600; done"]
    restart: unless-stopped
