services:
  narra:
    build: { context: .., dockerfile: service/Dockerfile }
    env_file: .env
    ports: ["127.0.0.1:4663:4663"]     # put a reverse proxy with TLS in front
    volumes: ["./data:/data"]
    restart: unless-stopped
  backup:
    image: alpine:3.20
    volumes: ["./data:/data", "./backups:/backups"]
    # every 6 h: consistent copy → gzip; keep 3 days (≈ 12 files × ~0.5 GB). A raw hourly copy of a 2 GB database fills a disk in a day.
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache sqlite gzip >/dev/null && while true; do f=/backups/narra-$$(date +%Y%m%d%H).db; sqlite3 /data/narra.db \".backup $$f\" && gzip -1 -f $$f; find /backups -name 'narra-*.db*' -mtime +3 -delete; sleep 21600; done"]
    restart: unless-stopped
